<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Washing Machine</title>

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #controls {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      background: rgba(0,0,0,.75);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      text-align: center;
      width: min(90vw, 360px);
    }
    button {
      font-size: 18px;
      padding: 10px 16px;
      margin: 4px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    #speed { font-weight: bold; }
  </style>
</head>

<body>
  <div id="controls">
    <div>ความเร็วเครื่องซักผ้า: <span id="speed">0</span> RPM</div>
    <button onclick="changeSpeed(-100)">−</button>
    <button onclick="stopMotor()">STOP</button>
    <button onclick="changeSpeed(100)">+</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- ใช้ Hiro marker เป็นค่าเริ่มต้น -->
    <a-marker preset="hiro">

      <!-- เครื่องซักผ้าแบบ 3D สร้างจาก primitive -->
      <a-entity id="washingMachine" position="0 0 0">

        <!-- ตัวเครื่อง -->
        <a-box position="0 0.75 0" width="1.4" height="1.5" depth="0.75"
               color="#d8d8d8"></a-box>

        <!-- แผงควบคุมด้านบน -->
        <a-box position="0 1.42 -0.39" width="1.25" height="0.25" depth="0.06"
               color="#303030"></a-box>

        <!-- ปุ่มควบคุม -->
        <a-cylinder position="0.35 1.45 -0.45" radius="0.07" height="0.04"
                     rotation="90 0 0" color="#eeeeee"></a-cylinder>

        <!-- ประตู -->
        <a-cylinder id="door" position="0 0.72 -0.405"
                     radius="0.43" height="0.08"
                     rotation="90 0 0" color="#222222"></a-cylinder>

        <a-cylinder position="0 0.72 -0.45"
                    radius="0.34" height="0.09"
                    rotation="90 0 0" color="#6fa8dc"></a-cylinder>

        <!-- ตรงกลางประตู -->
        <a-cylinder id="drum" position="0 0.72 -0.51"
                    radius="0.25" height="0.03"
                    rotation="90 0 0" color="#999999"></a-cylinder>

        <!-- ขาตั้ง -->
        <a-cylinder position="-0.5 0.05 0.25" radius="0.08" height="0.15" color="#555"></a-cylinder>
        <a-cylinder position="0.5 0.05 0.25" radius="0.08" height="0.15" color="#555"></a-cylinder>
        <a-cylinder position="-0.5 0.05 -0.25" radius="0.08" height="0.15" color="#555"></a-cylinder>
        <a-cylinder position="0.5 0.05 -0.25" radius="0.08" height="0.15" color="#555"></a-cylinder>

        <!-- ชุดผ้าจำลองในถัง -->
        <a-torus id="innerRing" position="0 0.72 -0.53"
                 radius="0.25" radius-tubular="0.035"
                 rotation="90 0 0" color="#ffffff"></a-torus>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

<script>
  let speed = 0;
  const MAX_SPEED = 1200;
  const MIN_SPEED = 0;

  const speedText = document.getElementById("speed");
  const drum = document.getElementById("drum");
  const innerRing = document.getElementById("innerRing");

  function updateSpeed() {
    speed = Math.max(MIN_SPEED, Math.min(MAX_SPEED, speed));
    speedText.textContent = speed;

    // ความเร็วการหมุนของถังจำลอง
    if (speed > 0) {
      drum.setAttribute("animation", {
        property: "rotation",
        to: "90 0 450",
        loop: true,
        dur: Math.max(100, 60000 / speed),
        easing: "linear"
      });

      innerRing.setAttribute("animation", {
        property: "rotation",
        to: "90 0 450",
        loop: true,
        dur: Math.max(100, 60000 / speed),
        easing: "linear"
      });
    } else {
      drum.removeAttribute("animation");
      innerRing.removeAttribute("animation");
    }
  }

  function changeSpeed(amount) {
    speed += amount;
    updateSpeed();
  }

  function stopMotor() {
    speed = 0;
    updateSpeed();
  }

  // รองรับคีย์บอร์ด
  document.addEventListener("keydown", (e) => {
    if (e.key === "+" || e.key === "=") changeSpeed(100);
    if (e.key === "-") changeSpeed(-100);
    if (e.key === " ") stopMotor();
  });

  updateSpeed();
</script>
</body>
</html>
